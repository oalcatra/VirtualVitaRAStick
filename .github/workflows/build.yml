name: Build VirtualVitaRAStick

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --parallel

      - name: Collect plugin
        run: |
          mkdir -p artifact
          cp build/VirtualVitaRAStick.skprx artifact/

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: VirtualVitaRAStick
          path: artifact/VirtualVitaRAStick.skprx
          if-no-files-found: error
