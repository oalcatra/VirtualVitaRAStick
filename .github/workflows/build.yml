name: Build VirtualVitaRAStick

on:
  push:
    branches: [ main, android-ports-userhook ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Collect plugins
        run: |
          mkdir -p artifact
          cp build/VirtualVitaRAStick.skprx artifact/
          cp build/VirtualVitaRAStickPorts.suprx artifact/
      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: VirtualVitaRAStick
          path: artifact/
          if-no-files-found: error
